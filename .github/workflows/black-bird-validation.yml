name: Black Bird Candidate Validation
# F10/R7: on pull_request, this intentionally runs against GitHub's default
# synthetic-merge checkout (see verify.yml's comment for why that's kept, not
# fixed) -- the legacy released-behavior suite (test:full) passing on the
# hypothetical merge result. exact-head-verify.yml and final-candidate-gate
# .yml are the exact-branch-head checks; this one is not a substitute for
# either.
on:
  pull_request:
  push:
    branches: [main]
permissions: {contents: read}
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:full
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: black-bird-candidate-evidence-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: error
          retention-days: 14
