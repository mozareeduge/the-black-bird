name: Black Bird Candidate Validation
on:
  pull_request:
  push:
    branches: [main]
permissions: {contents: read}
defaults:
  run:
    shell: bash

jobs:
  validate:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:full
      - name: Upload optional validation diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: black-bird-candidate-evidence-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 14
